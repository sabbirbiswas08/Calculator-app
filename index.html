<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supabase Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="calculator-card">
        <header class="card-header">
          <h1>Smart Calculator</h1>
          <p>All calculations are saved to Supabase history.</p>
        </header>

        <div class="display-wrap" aria-live="polite">
          <p id="expressionDisplay" class="expression">0</p>
          <p id="resultDisplay" class="result">0</p>
        </div>

        <div class="keypad" role="group" aria-label="Calculator keypad">
          <button class="btn btn-muted" data-action="clear">AC</button>
          <button class="btn btn-muted" data-action="delete">⌫</button>
          <button class="btn btn-muted" data-value="%">%</button>
          <button class="btn btn-op" data-value="/">÷</button>

          <button class="btn" data-value="7">7</button>
          <button class="btn" data-value="8">8</button>
          <button class="btn" data-value="9">9</button>
          <button class="btn btn-op" data-value="*">×</button>

          <button class="btn" data-value="4">4</button>
          <button class="btn" data-value="5">5</button>
          <button class="btn" data-value="6">6</button>
          <button class="btn btn-op" data-value="-">−</button>

          <button class="btn" data-value="1">1</button>
          <button class="btn" data-value="2">2</button>
          <button class="btn" data-value="3">3</button>
          <button class="btn btn-op" data-value="+">+</button>

          <button class="btn btn-wide" data-value="0">0</button>
          <button class="btn" data-value=".">.</button>
          <button class="btn btn-equal" data-action="calculate">=</button>
        </div>
      </section>

      <section class="history-card">
        <header class="history-header">
          <h2>Calculation History</h2>
          <button id="refreshHistoryBtn" class="btn btn-small">Refresh</button>
        </header>
        <p id="statusMessage" class="status-message">Loading history...</p>
        <ul id="historyList" class="history-list"></ul>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
  </body>
</html>
